# Runtime 供给流水线（nixport-rootfs）——单流水线构建并组装全部 rootfs 内容，
# 按**渠道**发布到多个滚动 release（多渠道范围修订）：
#   payload-latest   成品 payload + version/json + meta（app release 消费）
#   sysroot-latest   交叉编译 sysroot arm64（Port 开发者；x86_64 为内部输入不外发）
#   rootfs-latest    设备直装 zst + 锁定清单（手机/topup）
# multilib 客机树由独立流水线 multilib.yml 负责（手动触发，发布 multilib-latest）。
# 全量重建（组件部分重建已在多渠道拆分中移除——渠道自足，无需跨渠道补拉）。
# 发布前两级自检 MUST 通过（spec runtime-supply-chain）：chroot 存活 + 哨兵包 +
# qemu payload 自测。
name: Runtime supply

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian release the runtime tree is built from'
        required: true
        default: 'trixie'
        type: choice
        options: [trixie, sid]
      snapshot:
        description: 'Pin the Debian archive (YYYYMMDDTHHMMSSZ); empty = live archive'
        required: false
        default: ''
      tag_suffix:
        description: 'Optional suffix for the release tags (empty = *-latest)'
        required: false
        default: ''
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'third_party/**'
      - '.github/workflows/supply.yml'

permissions:
  contents: write

concurrency:
  group: supply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SUITE: ${{ github.event.inputs.suite || 'trixie' }}
      SNAPSHOT: ${{ github.event.inputs.snapshot }}
      SUFFIX: ${{ github.event.inputs.tag_suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Host packages
        # glslang-tools: Mesa 的 meson 需要 glslangValidator（首轮 CI 教训）。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache zstd pigz libarchive-tools \
            bison flex file glslang-tools >/dev/null
          sudo pip3 install --break-system-packages -q 'meson>=1.4' mako pyyaml packaging
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22 >/dev/null
          sudo apt-get install -y -qq libclang-cpp22-dev libclang-22-dev llvm-22-dev lld-22 >/dev/null
          for f in /usr/lib/llvm-22/bin/*; do sudo ln -sf "$f" /usr/local/bin/$(basename "$f"); done
          clang --version | head -1; meson --version

      # ---- 树类（每次都构建：组装与锁定清单依赖它们） -------------------------
      - name: Runtime tree (locked image)
        shell: bash
        run: |
          scripts/build-rootfs-image.sh 2>&1 | tail -40

      - name: sysroot-arm64 + x86_64 guest tree
        shell: bash
        run: |
          SYSROOT_ONLY=1 scripts/build-rootfs.sh 2>&1 | tail -40
          scripts/build-x86-sysroot.sh 2>&1 | tail -20

      # ---- 组件编译（全量；失败即红） ------------------------------------------
      - name: glibc (patched)
        shell: bash
        run: |
          scripts/build-glibc.sh 2>&1 | tail -40

      - name: fex + thunks
        shell: bash
        run: |
          scripts/build-fex.sh 2>&1 | tail -40

      - name: mesa turnip (KGSL)
        shell: bash
        run: |
          scripts/build-mesa.sh 2>&1 | tail -40

      # ---- 组装 + 打包（渠道分目录） --------------------------------------------
      - name: Assemble payload
        shell: bash
        run: |
          scripts/assemble-payload.sh 2>&1 | tail -40

      - name: Pack (per-channel staging)
        shell: bash
        run: |
          scripts/pack-release-assets.sh 2>&1 | tail -30

      - name: Smoke test (chroot + sentinels + payload qemu self-tests)
        shell: bash
        run: |
          scripts/smoke-test.sh 2>&1 | tail -40

      - name: Meta (per channel)
        shell: bash
        run: |
          scripts/gen-meta.sh payload
          scripts/gen-meta.sh sysroot
          scripts/gen-meta.sh rootfs

      - uses: actions/upload-artifact@v4
        with:
          name: nixport-rootfs-meta
          path: |
            build/release/*/meta.json
            build/release/payload/payload.version
            build/release/payload/payload.json
            build/release/rootfs/rootfs-arm64.packages.txt
          if-no-files-found: error

      # ---- 渠道发布（各滚动 release，--clobber 只动本渠道资产） -----------------
      - name: Publish payload-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="payload-latest$SUFFIX"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Nixport payload (assembled, self-tested)" \
              --notes "Assembled payload tars + payload.version/json. Contract: meta.json. Consumer: the app release (scripts/fetch-payload.sh)."
          gh release upload "$TAG" --clobber build/release/payload/*
          gh release edit "$TAG" --title "Nixport payload ($SUITE) ${GITHUB_SHA:0:7}"

      - name: Publish sysroot-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sysroot-latest$SUFFIX"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Nixport cross sysroot (arm64)" \
              --notes "Cross-compile sysroot for Port developers. Usage: my-docs/移植规范/Port打包规范.md"
          gh release upload "$TAG" --clobber build/release/sysroot/*
          gh release edit "$TAG" --title "Nixport sysroot (libc6: $(grep -m1 '^libc6 ' build/rootfs/rootfs-arm64.packages.txt | awk '{print $2}'))"

      - name: Publish rootfs-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rootfs-latest$SUFFIX"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Nixport runtime rootfs (device-direct)" \
              --notes "Device-direct runtime pack (.tar.zst) + lock lists (uris/base/packages, consumed by nxp-rootfs-topup.sh)."
          gh release upload "$TAG" --clobber build/release/rootfs/*
          gh release edit "$TAG" --title "Nixport device rootfs ($SUITE) ${GITHUB_SHA:0:7}"
