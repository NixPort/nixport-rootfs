# x86_64 侧构建：客机树（rootfs-x86_64）+ thunks 交叉 sysroot（sysroot-x86_64）。
#
# 范围修订（x86 拆分）：这两件是**存量稳定输入**——客机树不再演进、sysroot 只被
# 本仓库的 FEX 构建（内部输入）消费——所以从主管线（supply.yml）剥离：仅手动触发，
# 构建一次长期复用，主管线从 x86-latest 拉取。amd64 容器在 runner 上原生运行，
# 无需 qemu/binfmt，全程 ~5 分钟。
#
# x86-side build: guest tree (rootfs-x86_64) + thunks cross sysroot (sysroot-x86_64).
# Both are stable legacy inputs — the guest tree no longer evolves, and the sysroot
# only feeds FEX's thunk build inside this repo — so they live in this separate
# workflow: manual trigger, build once, reused by the main pipeline from x86-latest.
name: x86 assets

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Pin the Debian archive (YYYYMMDDTHHMMSSZ); empty = live archive'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SNAPSHOT: ${{ github.event.inputs.snapshot }}
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz zstd >/dev/null

      # amd64 容器原生运行：无 qemu/binfmt。
      - name: x86_64 guest tree
        shell: bash
        run: |
          SKIP_ARM=1 scripts/build-rootfs.sh 2>&1 | tail -20

      - name: sysroot-x86_64 (thunks cross sysroot)
        shell: bash
        run: |
          scripts/build-x86-sysroot.sh 2>&1 | tail -10

      - name: Pack x86 channel
        run: |
          mkdir -p build/release/x86
          ( cd build/rootfs && tar --sort=name --owner=0 --group=0 -cf - rootfs-x86_64.tar | pigz -9 ) \
            > build/release/x86/rootfs-x86_64.tar.gz
          ( cd build/rootfs && tar --sort=name --owner=0 --group=0 -cf - sysroot-x86_64 | pigz -9 ) \
            > build/release/x86/sysroot-x86_64.tar.gz
          cp build/rootfs/rootfs-x86_64.packages.txt build/release/x86/
          # 显式文件名：glob 必须在目标目录展开，否则字面量 '*.tar.gz' 传入 sha256sum
          # （首轮实锤：glob 在 repo 根展开 → No such file or directory）。
          (
            cd build/release/x86
            sha256sum rootfs-x86_64.tar.gz sysroot-x86_64.tar.gz > sha256s.txt
            sha256sum rootfs-x86_64.tar.gz > rootfs-x86_64.tar.gz.sha256
            sha256sum sysroot-x86_64.tar.gz > sysroot-x86_64.tar.gz.sha256
            ls -la
          )

      - name: Publish x86-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view x86-latest >/dev/null 2>&1 || \
            gh release create x86-latest --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Nixport x86 assets (guest tree + thunks sysroot)" \
              --notes "Stable legacy inputs consumed by the main supply pipeline (FEX thunk build + payload-x86_64). Rebuild only when the x86 base must change."
          gh release upload x86-latest --clobber build/release/x86/*
          gh release edit x86-latest --title "Nixport x86 assets ${GITHUB_SHA:0:7}"
