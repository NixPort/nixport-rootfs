# 原料层流水线（范围修订：依赖图提升）。
#
# 构建**所有下游流水线的公共祖先**——它们唯一的变化来源是包清单/基底镜像/Debian
# archive，与 app 无关，所以独立成层、按需重建、长期复用：
#   锁定 Runtime 树（arm64 Debian，uris 锁定 + 基底 digest）
#   sysroot-arm64 / sysroot-x86_64（交叉编译视图）
#   x86_64 客机树（存量稳定）
# 发布两个滚动 release：
#   base-latest   原料资产（fex.yml 与 supply.yml 从这里拉取）
# 包数下限断言在本层拦截（uris 空装 bug 的最早拦截点）。
# 原先的 x86.yml 已并入本流水线（其产物就是原料）。
name: base assets

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian release the trees are built from'
        required: true
        default: 'trixie'
        type: choice
        options: [trixie, sid]
      snapshot:
        description: 'Pin the Debian archive (YYYYMMDDTHHMMSSZ); empty = live archive'
        required: false
        default: ''
permissions:
  contents: write

concurrency:
  group: base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUITE: ${{ github.event.inputs.suite || 'trixie' }}
      SNAPSHOT: ${{ github.event.inputs.snapshot }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # arm64 树经 qemu；x86_64 侧原生。
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd pigz >/dev/null

      - name: Fetch uruntime (AppImage runtime, pinned)
        # uruntime 不是 Debian 包（进不了包表），是单独 pin 的拉取：版本与
        # sha256 在 scripts/uruntime-pin.env。装进 rootfs 的 /usr/local/bin/，
        # 供 app 侧导入期解 AppImage 的第一级途径。
        # uruntime is not a Debian package (it cannot ride the package list), so
        # it is a separate pinned fetch: version + sha256 in
        # scripts/uruntime-pin.env. It lands in the rootfs's /usr/local/bin/ for
        # the app's first extraction route.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/fetch-uruntime.sh 2>&1 | tail -10

      - name: Runtime tree (locked image)
        shell: bash
        run: |
          scripts/build-rootfs-image.sh 2>&1 | tail -30

      - name: glibc (patched)
        # glibc 归位原料层（extract-rootfs-repo 拆分补完）：补丁版 glibc 是"树的一部分"，
        # 与树同源（packages.txt 契约）同 run 产出，与 payload 组装时覆盖的是同一份 glibc；sysroot 刻意保持纯 Debian（交叉编译视图不受补丁影响）。
        # glibc belongs to the base layer: same source as the tree (packages.txt
        # contract), same run. sysroot stays stock Debian on purpose.
        shell: bash
        run: |
          scripts/build-glibc.sh 2>&1 | tail -30

      - name: Overlay patched glibc into the runtime tree
        shell: bash
        run: |
          scripts/overlay-glibc.sh 2>&1 | tail -5

      - name: sysroot-arm64 + x86_64 guest tree + sysroot-x86_64
        shell: bash
        run: |
          SYSROOT_ONLY=1 scripts/build-rootfs.sh 2>&1 | tail -20
          scripts/build-x86-sysroot.sh 2>&1 | tail -10

      - name: Pack base assets
        # 包数下限断言：uris 空装 bug（树只剩基底 78 包）的最早拦截点——在原料层
        # 就拦住，不让坏树流向任何下游。
        shell: bash
        run: |
          mkdir -p build/release
          # packages.txt 是 dpkg-query -W 的裸格式（每行"包名 版本"），不是
          # dpkg status 的 "Package: xxx" 格式——数行数即可。
          # packages.txt is dpkg-query -W output ("pkg version" per line), not
          # dpkg-status format — count lines.
          NP="$(wc -l < build/rootfs/rootfs-arm64.packages.txt | tr -d ' ')"
          [[ "$NP" -ge 250 ]] || { echo "BASE FAIL: runtime tree has only $NP packages (manifest install broke?)" >&2; exit 1; }
          ( cd build/rootfs && tar --sort=name --owner=0 --group=0 -cf - rootfs-arm64.tar | pigz -9 ) \
            > build/release/rootfs-arm64.tar.gz
          # glibc DESTDIR 树（顶层目录 glibc/），supply 拉取后挪到 build/glibc
          ( cd build && tar --sort=name --owner=0 --group=0 -cf - glibc | pigz -9 ) \
            > build/release/glibc.tar.gz
          ( cd build/rootfs && tar --sort=name --owner=0 --group=0 -cf - sysroot-arm64 | pigz -9 ) \
            > build/release/sysroot-arm64.tar.gz
          ( cd build/rootfs && tar --sort=name --owner=0 --group=0 -cf - sysroot-x86_64 | pigz -9 ) \
            > build/release/sysroot-x86_64.tar.gz
          ( cd build/rootfs && tar --sort=name --owner=0 --group=0 -cf - rootfs-x86_64.tar | pigz -9 ) \
            > build/release/rootfs-x86_64.tar.gz
          # 契约文件随发：packages.txt 的 libc6 是全体系的 ABI 基线记录
          cp build/rootfs/rootfs-arm64.packages.txt build/release/
          for f in rootfs-arm64.tar.gz sysroot-arm64.tar.gz sysroot-x86_64.tar.gz rootfs-x86_64.tar.gz glibc.tar.gz; do
            ( cd build/release && sha256sum "$f" > "$f.sha256" )
          done
          echo "runtime tree packages: $NP"
          ls -la build/release

      - name: Publish base-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view base-latest >/dev/null 2>&1 || \
            gh release create base-latest --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Nixport base assets (trees + sysroots)" \
              --notes "Raw materials consumed by fex.yml / supply.yml / Port developers (sysroot-arm64). Contract: rootfs-arm64.packages.txt (libc6 version is the ABI baseline)."
          gh release upload base-latest --clobber \
            build/release/rootfs-arm64.tar.gz \
          build/release/glibc.tar.gz \
            build/release/sysroot-arm64.tar.gz \
            build/release/sysroot-x86_64.tar.gz \
            build/release/rootfs-x86_64.tar.gz \
            build/release/rootfs-arm64.packages.txt \
            build/release/*.sha256
          gh release edit base-latest --title "Nixport base assets ($SUITE) ${GITHUB_SHA:0:7}"

